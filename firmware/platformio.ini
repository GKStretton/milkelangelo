; PlatformIO project config
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
lib_deps = waspinator/AccelStepper@^1.64
; src/ still holds the old Mega (AVR) app tree used by ../firmware.ino;
; scope this build to just the new ESP32 entry point until it's ported.
build_src_filter = -<*> +<main.cpp>
