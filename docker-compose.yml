version: "3.7"

volumes:
  mqtt:

services:
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    network_mode: host
    user: "1000:1000"
    volumes:
      - ${LIGHT_STORES_DIR:-/mnt/md0/light-stores/}:${LIGHT_STORES_DIR:-/mnt/md0/light-stores/}
    restart: always
  rtsp:
    build: rtsp
    restart: always
    network_mode: host
    ports:
      - 8554:8554
      - 8888:8888
      - 8889:8889
    volumes:
      - ./rtsp/rtsp-simple-server.yml:/rtsp-simple-server.yml
      - ./rtsp/scripts:/scripts
      - ${LIGHT_STORES_DIR:-/mnt/md0/light-stores/}/kv:/config
    devices:
      - ${TOP_CAM:-/dev/video2}:/dev/top-cam
      - ${FRONT_CAM:-/dev/video0}:/dev/front-cam
  goo:
    build:
      context: .
      dockerfile: goo/Dockerfile
    restart: always
    network_mode: host
    volumes:
      - ${LIGHT_STORES_DIR:-/mnt/md0/light-stores/}:${LIGHT_STORES_DIR:-/mnt/md0/light-stores/}
      - /dev:/dev
    user: "1000:1000"
    environment:
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
      ENABLE_EBS: ${ENABLE_EBS:-false}
      EBS_HOST: ${EBS_HOST}
      SHARED_SECRET_EBS: ${SHARED_SECRET_EBS}
  interface:
    build:
      context: ./interface
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
  mqtt:
    build: mqtt
    ports:
      - 1883:1883
    volumes:
      - mqtt:/mosquitto/data
    tmpfs:
      - /mosquitto/log
    network_mode: host
    restart: always
