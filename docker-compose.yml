version: "3.7"

volumes:
  mqtt:

services:
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    network_mode: host
    user: "1000:1000"
    volumes:
      - ${LIGHT_STORES_DIR:-/mnt/md0/light-stores/}:${LIGHT_STORES_DIR:-/mnt/md0/light-stores/}
    restart: always
  rtsp:
    build: rtsp
    restart: always
    network_mode: host
    ports:
      - 8554:8554
      - 8888:8888
      - 8889:8889
    volumes:
      - ./rtsp/rtsp-simple-server.yml:/rtsp-simple-server.yml
      - ./rtsp/scripts:/scripts
      - ${LIGHT_STORES_DIR:-/mnt/md0/light-stores/}/kv:/config
    devices:
      - ${TOP_CAM:-/dev/video2}:/dev/top-cam
      - ${FRONT_CAM:-/dev/video0}:/dev/front-cam
    environment:
      # overrides webrtcICEServers in rtsp-simple-server.yml. Set in .env to
      # add a TURN relay, keeping its credentials out of the repo.
      RTSP_WEBRTCICESERVERS: ${WEBRTC_ICE_SERVERS:-stun:stun.l.google.com:19302}
  goo:
    build:
      context: .
      dockerfile: goo/Dockerfile
    restart: always
    network_mode: host
    volumes:
      - ${LIGHT_STORES_DIR:-/mnt/md0/light-stores/}:${LIGHT_STORES_DIR:-/mnt/md0/light-stores/}
      - /dev:/dev
    user: "1000:1000"
    environment:
      LIGHT_STORES_DIR: ${LIGHT_STORES_DIR:-/mnt/md0/light-stores/}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
      ENABLE_PUBLIC_API: ${ENABLE_PUBLIC_API:-true}
      # all interfaces, so it's reachable over tailscale like the interface
      PUBLIC_API_ADDR: ${PUBLIC_API_ADDR:-:8789}
      PUBLIC_UI_DIR: /app/remote
      MEDIAMTX_URL: http://127.0.0.1:8889
      # Cloudflare TURN key, so viewers who can't reach MediaMTX directly get
      # relay credentials. Set in .env; video still works on tailscale without.
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
  interface:
    build:
      context: ./interface
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
  mqtt:
    build: mqtt
    ports:
      - 1883:1883
    volumes:
      - mqtt:/mosquitto/data
    tmpfs:
      - /mosquitto/log
    network_mode: host
    restart: always
