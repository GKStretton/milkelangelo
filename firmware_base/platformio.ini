; PlatformIO project config
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
; ESP32 Dev Module equivalent of arduino-cli's esp32:esp32:esp32da FQBN.
; Verify this matches your actual board and adjust if needed.
board = esp32dev
framework = arduino
monitor_speed = 9600
lib_deps =
    bblanchon/ContinuousStepper@3.1.0
    knolleary/PubSubClient@2.8
